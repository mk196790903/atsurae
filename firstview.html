<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>l'atelier Yumiko｜ファーストビュー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Great+Vibes&family=Shippori+Mincho:wght@400;500;600&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/firstview.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header" id="header">
    <div class="header__inner">
      <div class="header__logo">
        <div class="header__logo-mark">
          <span class="header__logo-script">l'atelier</span>
          <span class="header__logo-name">Yumiko</span>
        </div>
        <span class="header__logo-sub">Handmade Soap &amp; Cosmetics</span>
      </div>
      <nav class="header__nav" id="headerNav">
        <ul class="header__nav-list">
          <li><a href="#">私たちについて</a></li>
          <li><a href="#">こだわり</a></li>
          <li><a href="#">商品</a></li>
          <li><a href="#">お客様の声</a></li>
          <li><a href="#">お問い合わせ</a></li>
        </ul>
      </nav>
      <a href="#" class="btn btn--outline">ご注文はこちら</a>
      <button class="header__burger" id="burgerBtn" aria-label="メニューを開く" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ===== HERO（ファーストビュー） ===== -->
  <section class="hero">
    <div class="hero__inner">

      <!-- Left: Text -->
      <div class="hero__content">
        <div class="hero__deco-line" aria-hidden="true">
          <span class="hero__deco-rule"></span>
          <svg class="hero__leaf-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2-8 2 2-2 4-4 4-4s-7 2-9 8c0 0 2-1 4-1z"/>
          </svg>
          <span class="hero__deco-rule"></span>
        </div>

        <h1 class="hero__title">
          <span class="hero__title--gold">あなたのためだけに<br>あつらえる、</span>
          <span class="hero__title--navy">手作りの石けんと<br>ナチュラルコスメ。</span>
        </h1>

        <p class="hero__desc">
          オーダーメイドのスキンケア<br>
          京都宇治のアトリエから、心穏やかな贅沢な時間を。
        </p>

        <div class="hero__badge">
          <svg class="hero__badge-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2-8 2 2-2 4-4 4-4s-7 2-9 8c0 0 2-1 4-1z"/>
          </svg>
          <span>薬剤師・手作り石鹸家・25年以上の想いを込めて。</span>
          <svg class="hero__badge-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M7 14c0 2.76 2.24 5 5 5s5-2.24 5-5H7zm10-5h-1V8c0-2.76-2.24-5-5-5S6 5.24 6 8v1H5c-.55 0-1 .45-1 1s.45 1 1 1h14c.55 0 1-.45 1-1s-.45-1-1-1zm-3 0H10V8c0-1.1.9-2 2-2s2 .9 2 2v1z"/>
          </svg>
        </div>

        <div class="hero__cta-wrap">
          <a href="#" class="btn btn--primary">ご注文・お問い合わせ</a>
          <a href="#" class="btn btn--ghost">商品を見る →</a>
        </div>
      </div>

      <!-- Right: Image -->
      <div class="hero__image-wrap">
        <div class="hero__image-frame">
          <img src="images/img2.jpg" alt="" class="hero__bg-img" aria-hidden="true">
          <img src="images/img1.jpg" alt="手作りの石けん" class="hero__image">
        </div>
        <!-- Botanical decoration -->
        <svg class="hero__botanical" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 400" aria-hidden="true">
          <path d="M60 400 C60 300 100 270 110 190 C120 110 90 50 60 0" fill="none" stroke="#1d3557" stroke-width="1.2" opacity="0.18"/>
          <path d="M60 340 C85 315 105 290 98 255" fill="none" stroke="#1d3557" stroke-width="1" opacity="0.15"/>
          <path d="M60 270 C35 248 18 218 32 182" fill="none" stroke="#1d3557" stroke-width="1" opacity="0.15"/>
          <path d="M60 200 C92 178 108 148 96 112" fill="none" stroke="#1d3557" stroke-width="1" opacity="0.15"/>
          <path d="M60 130 C38 110 22 82 38 46" fill="none" stroke="#1d3557" stroke-width="1" opacity="0.15"/>
          <ellipse cx="98" cy="255" rx="12" ry="7" transform="rotate(-30 98 255)" fill="none" stroke="#1d3557" stroke-width="0.8" opacity="0.12"/>
          <ellipse cx="32" cy="182" rx="12" ry="7" transform="rotate(20 32 182)" fill="none" stroke="#1d3557" stroke-width="0.8" opacity="0.12"/>
          <ellipse cx="96" cy="112" rx="12" ry="7" transform="rotate(-40 96 112)" fill="none" stroke="#1d3557" stroke-width="0.8" opacity="0.12"/>
        </svg>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
